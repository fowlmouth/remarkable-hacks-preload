name: Builder image

# Rebuilds the SDK builder image whenever the Containerfile changes and
# pushes it to ghcr.io/<owner>/<repo>/builder as a multi-platform manifest
# (linux/amd64 + linux/arm64).

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and metadata
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/builder" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # arm64 leg of the multi-platform build is emulated on the amd64 runner
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=sha-${{ env.SHORT_SHA }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
