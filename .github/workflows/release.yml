name: Release

# On a v* tag: compile librmhacks with the SDK builder image (amd64 leg:
# x86_64-hosted SDK cross-compiles to armhf natively, no emulation) and
# publish the .so as a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/builder" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild the amd64 image locally from the Containerfile, reusing the
      # cached layers pushed by the builder-image workflow (full build only
      # on first run).
      - name: Prepare builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: rmhacks-builder:local
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Compile
        run: |
          docker run --rm -v "$PWD":/work -w /work rmhacks-builder:local \
            bash -c '. "$SDK_ENV" && qmake && make -j"$(nproc)"'

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          lib="$(find . -maxdepth 1 -type f -name 'librmhacks.so*' | head -n1)"
          lib="${lib#./}"
          echo "LIB_NAME=${lib}" >> "$GITHUB_ENV"

          # sanity check: armhf ELF for the device
          file "$lib" | grep -q 'ARM'

          mkdir -p dist
          cp -f "$lib" rmhacks.conf dist/
          (cd dist && sha256sum "$lib" rmhacks.conf > SHA256SUMS)
          tar -czf "rmhacks-${tag}.tar.gz" -C dist .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rmhacks-${{ github.ref_name }}.tar.gz
            dist/${{ env.LIB_NAME }}
          generate_release_notes: true
